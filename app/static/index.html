<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>QZZ剪贴板</title>
<link rel="icon" href="data:,">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #f3f5f9;
    --panel-solid: #ffffff;
    --border: #d7deeb;
    --border-soft: #e7ebf3;
    --text: #1d2433;
    --muted: #66718a;
    --accent: #4f7cf7;
    --accent-grad: linear-gradient(135deg, #4f7cf7, #8b5cf6);
    --ok: #0ea76f;
    --warn: #c97a0a;
    --err: #dc2626;
    --radius: 14px;
    --shadow-lg: 0 1px 2px rgba(23, 32, 58, .04), 0 12px 32px rgba(23, 32, 58, .08);
    --shadow-sm: 0 1px 2px rgba(23, 32, 58, .04), 0 6px 18px rgba(23, 32, 58, .06);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1100px 550px at 85% -10%, rgba(79, 124, 247, .10), transparent 60%),
      radial-gradient(900px 500px at -10% 25%, rgba(139, 92, 246, .07), transparent 60%),
      radial-gradient(rgba(79, 124, 247, .07) 1px, transparent 1.5px);
    background-size: auto, auto, 22px 22px;
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: rgba(79, 124, 247, .22); }
  [hidden] { display: none !important; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 72px; }

  /* ---- 顶部栏（吸顶毛玻璃） ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    margin: 0 -16px 20px; padding: 12px 16px;
    background: rgba(255, 255, 255, .8);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }
  header h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .3px; }
  .logo {
    width: 32px; height: 32px; border-radius: 10px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent-grad);
    box-shadow: 0 2px 10px rgba(79, 124, 247, .35);
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.err { background: var(--err); box-shadow: 0 0 8px var(--err); }
  .dot.busy { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

  /* ---- 卡片容器 ---- */
  .card {
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow-lg);
    padding: 18px;
    margin-bottom: 20px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .card-title { font-size: 15px; margin: 0; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .chip {
    background: var(--bg); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 3px 11px; font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .chip:empty { display: none; }

  /* ---- 主输入框 / 图片视图 ---- */
  textarea {
    width: 100%;
    min-height: 200px;
    resize: vertical;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 14px 16px;
    font: 14px/1.7 ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  textarea:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(79, 124, 247, .15); }
  .image-view { display: flex; flex-direction: column; gap: 10px; }
  .image-frame {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    min-height: 180px;
    display: flex; align-items: center; justify-content: center;
  }
  .image-frame img { max-width: 100%; max-height: 340px; border-radius: 8px; display: block; cursor: zoom-in; }
  .image-meta { color: var(--muted); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin: 10px 2px 0; color: var(--muted); font-size: 13px; flex-wrap: wrap; gap: 8px; }

  /* ---- 按钮 ---- */
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 11px;
    padding: 9px 16px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: transform .08s, border-color .15s, background .15s, box-shadow .15s, color .15s, filter .15s;
    -webkit-user-select: none; user-select: none;
  }
  button svg { flex: none; }
  button:hover { border-color: var(--accent); color: var(--accent); background: #fff; }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary {
    background: var(--accent-grad);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 14px rgba(79, 124, 247, .32);
  }
  button.primary:hover { filter: brightness(1.08); color: #fff; background: var(--accent-grad); }
  button.danger:hover { border-color: var(--err); color: var(--err); background: #fff; }
  button.danger.armed { background: var(--err); border-color: var(--err); color: #fff; box-shadow: 0 4px 14px rgba(220, 38, 38, .35); }
  button.danger.armed:hover { background: var(--err); border-color: var(--err); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .tip { color: var(--muted); font-size: 12px; margin: 12px 2px 0; line-height: 1.7; display: flex; align-items: center; gap: 6px; }

  /* ---- 远程更新提示条 ---- */
  .banner {
    display: none;
    background: rgba(201, 122, 10, .07);
    border: 1px solid var(--warn);
    color: var(--warn);
    padding: 11px 14px;
    border-radius: var(--radius);
    margin-bottom: 16px;
    font-size: 14px;
    align-items: center;
    gap: 10px;
    justify-content: space-between;
  }
  .banner.show { display: flex; animation: rise .25s ease-out; }
  .banner-msg { display: inline-flex; align-items: center; gap: 8px; }
  .banner button { border-color: var(--warn); color: var(--warn); background: rgba(201, 122, 10, .06); }
  .banner button:hover { background: var(--warn); color: #fff; }

  /* ---- 历史记录 ---- */
  .sec-title { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 14px; gap: 12px; flex-wrap: wrap; }
  .sec-title h2 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .sec-title h2::before { content: ''; width: 4px; height: 16px; border-radius: 2px; background: var(--accent-grad); }
  .sec-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .count { font-size: 12px; background: var(--panel-solid); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .search-box { position: relative; display: flex; align-items: center; }
  .search-box svg { position: absolute; left: 11px; pointer-events: none; color: var(--muted); }
  .search-box input {
    background: var(--panel-solid); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 14px 7px 34px;
    font-size: 13px; color: var(--text); outline: none; width: 170px;
    font-family: inherit;
    transition: border-color .15s, width .2s, box-shadow .15s;
  }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 124, 247, .12); }
  .empty {
    background: var(--panel-solid);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .empty-icon {
    width: 64px; height: 64px; border-radius: 50%;
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    background: rgba(79, 124, 247, .1);
    border: 1px solid rgba(79, 124, 247, .22);
  }
  .empty-title { font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .empty-sub { font-size: 12px; }

  .item {
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
    animation: rise .28s ease-out;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .item:hover { border-color: #b9c7e6; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(23, 32, 58, .09); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .item pre {
    margin: 0 0 8px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 220px;
    overflow: auto;
    font: 13px/1.7 ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
    scrollbar-width: thin;
  }
  .item pre.clamped { max-height: 10.2em; overflow: hidden; }
  .expand-btn {
    display: block; margin: 0 0 10px; padding: 2px 8px;
    background: none; border: none; color: var(--accent);
    font-size: 12px; cursor: pointer;
  }
  .expand-btn:hover { text-decoration: underline; color: var(--accent-2); }
  .url-card {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 10px; padding: 10px 12px; min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    transition: border-color .15s, box-shadow .15s;
  }
  .url-card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 124, 247, .12); }
  .url-card svg { flex: none; }
  .url-card span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item pre a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
  .item pre a:hover { color: var(--accent-2); }
  .thumb-wrap {
    margin: 0 0 12px;
    cursor: zoom-in;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb { max-width: 100%; max-height: 220px; border-radius: 6px; display: block; }
  .item .item-meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; flex-wrap: wrap; gap: 8px; }
  .item .item-meta .time { font-variant-numeric: tabular-nums; }
  .item .item-meta .btnrow { gap: 8px; }
  .item .item-meta button { padding: 6px 13px; font-size: 12px; background: var(--bg); }
  .item .item-meta button.armed,
  .item .item-meta button.armed:hover { background: var(--err); border-color: var(--err); color: #fff; }

  /* ---- 弹窗 / 灯箱 ---- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(23, 32, 58, .45);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--panel-solid); border: 1px solid var(--border);
    border-radius: 18px; padding: 26px; width: 100%; max-width: 400px;
    box-shadow: var(--shadow-lg);
    animation: rise .25s ease-out;
  }
  .modal h3 { margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .modal p { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .modal input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 11px; color: var(--text); padding: 11px 13px; font-size: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 124, 247, .15); }
  .modal .btnrow { margin-top: 18px; justify-content: flex-end; }

  .lightbox {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(8, 10, 16, .92);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    cursor: zoom-out;
  }
  .lightbox img { max-width: 92vw; max-height: 86vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0, 0, 0, .6); }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255, 255, 255, .12); border: none; color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .lightbox-close:hover { background: rgba(255, 255, 255, .24); }

  /* ---- 轻提示 ---- */
  .toast {
    position: fixed; left: 50%; bottom: calc(26px + var(--safe-b));
    transform: translateX(-50%) translateY(16px) scale(.95);
    background: rgba(255, 255, 255, .96);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px; border-radius: 999px;
    font-size: 14px; box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 300;
    max-width: 86vw;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

  /* ---- 滚动条 ---- */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #c4cddd; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #aeb9cf; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---- 移动端适配 ---- */
  @media (max-width: 640px) {
    .wrap { padding: 0 14px 88px; }
    header { margin: 0 -14px 16px; padding: 10px 14px; }
    .card { padding: 14px; border-radius: 16px; }
    textarea { min-height: 140px; font-size: 16px; padding: 12px 14px; } /* 16px 防止 iOS 聚焦时自动缩放 */
    #actions { display: grid; grid-template-columns: 1fr; }
    #actions button { grid-column: 1 / -1; min-height: 44px; font-size: 15px; padding: 8px 6px; } /* 触控目标 ≥ 44px */
    .item { padding: 12px 14px; }
    .item .item-meta button { min-height: 40px; padding: 6px 14px; }
    .sec-title { flex-direction: column; align-items: stretch; }
    .sec-actions { justify-content: space-between; }
    .search-box { flex: 1; }
    .search-box input { width: 100%; }
    .image-frame img { max-height: 260px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>
      <span class="logo">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
      </span>
      QZZ剪贴板
    </h1>
    <div class="status-pill">
      <span class="dot" id="dot"></span>
      <span id="status">连接中…</span>
    </div>
  </header>

  <div class="banner" id="banner">
    <span class="banner-msg">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      检测到来自其他设备的更新
    </span>
    <button id="bannerLoad">加载</button>
  </div>

  <section class="card">
    <div class="card-head">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        当前剪贴板
      </h2>
      <span class="chip" id="chars">0 字符</span>
    </div>

    <textarea id="clip" placeholder="在这里粘贴或输入文字，会自动保存到服务器，其他设备打开本页即可看到…" spellcheck="false"></textarea>

    <div class="image-view" id="imageView" hidden>
      <div class="image-frame"><img id="clipImage" alt="剪贴板图片"></div>
      <div class="image-meta" id="imageMeta"></div>
    </div>

    <div class="meta">
      <span class="chip" id="lastSaved"></span>
    </div>
    <div class="btnrow" id="actions">
      <button id="pasteBtn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M12 11v6"/><path d="m9 14 3 3 3-3"/></svg>
        读取系统剪贴板
      </button>
      <button id="copyBtn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        复制全部
      </button>
      <button id="copyImageBtn" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        复制图片
      </button>
      <button id="downloadBtn" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        下载
      </button>
      <button class="danger" id="clearBtn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        清空
      </button>
    </div>
    <div class="tip">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span id="tipText">在页面任意位置按 Ctrl+V 可直接粘贴文字或图片，自动保存并同步到其他设备</span>
    </div>
  </section>

  <div class="sec-title">
    <h2>历史记录 <span class="count" id="histCount"></span></h2>
    <div class="sec-actions">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="search" placeholder="搜索历史" autocomplete="off">
      </div>
      <button id="clearHistBtn" class="danger">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        清空历史
      </button>
    </div>
  </div>
  <div id="history"></div>

</div>

<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="关闭">✕</button>
  <img id="lightboxImg" alt="查看大图">
</div>

<div class="modal-backdrop" id="loginModal">
  <div class="modal">
    <h3>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      输入访问密钥
    </h3>
    <p>密钥只会保存在这台浏览器的本地存储中，之后无需重复输入。</p>
    <input type="password" id="tokenInput" placeholder="粘贴 CLIPBOARD_TOKEN" autocomplete="off">
    <div class="btnrow">
      <button id="tokenCancel">取消</button>
      <button class="primary" id="tokenOk">进入</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const clip = $('clip');
  const statusEl = $('status');
  const dot = $('dot');
  const clipImg = $('clipImage');
  const imageMetaEl = $('imageMeta');
  const TOKEN_KEY = 'pasteboard_token';
  let token = localStorage.getItem(TOKEN_KEY) || '';

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && window.innerWidth < 768);
  $('tipText').textContent = isMobile
    ? '长按文本框选择「粘贴」，或点「读取系统剪贴板」上传图片/文字'
    : '在页面任意位置按 Ctrl+V 可直接粘贴文字或图片，自动保存并同步到其他设备';

  const SAVE_DEBOUNCE = 800;
  const POLL_FAST = 4000;
  const POLL_SLOW = 15000;
  const IDLE_MS = 120000; // 2 分钟无操作 → 降频
  const HISTORY_POLL_MS = 10000;
  let lastVersion = -1;
  let dirty = false;
  let pendingRemote = null;
  let saveTimer = null;
  let lastSavedText = '';
  let lastSavedAt = null;

  // 自适应轮询
  let pollMs = POLL_FAST;
  let pollTimer = null;
  let historyTimer = null;
  let idleTimer = null;

  // 当前剪贴板图片（主视图）
  let currentImageBlob = null;
  let currentImageUrl = null;

  // 历史记录：完整列表 + 元素 Map + 图片缓存（按 image_id）
  let historyItems = [];
  let historyElMap = new Map();
  const imageCache = new Map(); // image_id -> {url, blob}
  let searchQuery = '';

  const ICON_COPY = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const ICON_TRASH = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
  const ICON_IMG = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
  const ICON_DL = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
  const ICON_LINK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';

  // ---- 历史记录里的网址链接 ----
  const URL_RE = /(?:https?:\/\/|www\.)[^\s<>"'`，。；：！？、（）【】《》「」『』]+/gi;

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 去掉 URL 末尾常见的中英文标点（粘贴时常带）
  function cleanUrl(u) {
    return u.replace(/[.,;:!?)\]}>"''”』」】》]+$/, '');
  }

  // 把转义后的文本里的 URL 包成 <a>（安全：入参已转义，直接作为文本输出）
  function linkify(escapedText) {
    return escapedText.replace(URL_RE, (m) => {
      const h = cleanUrl(/^www\./i.test(m) ? 'https://' + m : m).replace(/["']/g, '');
      return '<a href="' + h + '" target="_blank" rel="noopener noreferrer">' + h + '</a>';
    });
  }

  // 整条内容是否就是一个网址
  function isSingleUrl(text) {
    const t = text.trim();
    const m = t.match(URL_RE);
    return !!m && m.length === 1 && cleanUrl(m[0]) === t;
  }

  function setStatus(kind, text) {
    statusEl.textContent = text || '';
    dot.className = 'dot ' + kind;
  }

  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    const p = (n) => String(n).padStart(2, '0');
    const hms = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    const today = new Date();
    if (d.toDateString() === today.toDateString()) return '今天 ' + hms;
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hms;
  }

  function updateLastSaved() {
    const el = $('lastSaved');
    el.textContent = lastSavedAt ? '最后保存 ' + fmtTime(lastSavedAt) : '';
  }

  async function api(path, options = {}) {
    const headers = Object.assign({}, options.headers);
    if (token) headers['X-Clipboard-Token'] = token;
    let body = options.body;
    if (body && typeof body === 'object' && !(body instanceof Blob)) {
      headers['Content-Type'] = 'application/json';
      body = JSON.stringify(body);
    }
    const res = await fetch(path, Object.assign({}, options, { headers, body }));
    if (res.status === 304) return { __notModified: true }; // 条件请求：无变化
    if (res.status === 401) {
      showLogin();
      throw new Error('unauthorized');
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  // ---- 登录弹窗 ----
  function showLogin() {
    $('loginModal').classList.add('show');
    setTimeout(() => $('tokenInput').focus(), 50);
  }
  function hideLogin() { $('loginModal').classList.remove('show'); }
  $('tokenOk').onclick = async () => {
    const v = $('tokenInput').value.trim();
    if (!v) return;
    token = v;
    localStorage.setItem(TOKEN_KEY, v);
    hideLogin();
    init();
  };
  $('tokenCancel').onclick = () => { if (token) hideLogin(); };
  $('tokenInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('tokenOk').click(); });

  // ---- 视图切换（文字 / 图片） ----
  function setView(mode) {
    const isImage = mode === 'image';
    clip.hidden = isImage;
    $('imageView').hidden = !isImage;
    $('copyBtn').hidden = isImage;
    $('copyImageBtn').hidden = !isImage;
    $('downloadBtn').hidden = !isImage;
    $('chars').hidden = isImage;
    if (!isImage) autoResize();
  }

  // 应用服务器返回的剪贴板状态
  function applyClipboard(data) {
    lastVersion = data.version;
    lastSavedText = data.content || '';
    lastSavedAt = data.updated_at;
    if (data.type === 'image') {
      setView('image');
      clip.value = ''; // 清掉文字残留，避免后续保存被防重复逻辑跳过
      updateChars();
      loadClipboardImage(data.image_id);
    } else {
      setView('text');
      clip.value = data.content || '';
      updateChars();
      if (currentImageUrl) { URL.revokeObjectURL(currentImageUrl); currentImageUrl = null; }
      currentImageBlob = null;
      clipImg.removeAttribute('src');
    }
    updateLastSaved();
  }

  function loadClipboardImage(imageId) {
    imageMetaEl.textContent = '加载中…';
    fetch('/api/images/' + imageId, { headers: { 'X-Clipboard-Token': token } })
      .then((r) => {
        if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
        if (!r.ok) throw new Error('http');
        return r.blob();
      })
      .then((blob) => {
        if (currentImageUrl) URL.revokeObjectURL(currentImageUrl);
        currentImageBlob = blob;
        currentImageUrl = URL.createObjectURL(blob);
        clipImg.src = currentImageUrl;
        imageMetaEl.textContent = (blob.type || 'image') + ' · ' + Math.round(blob.size / 1024) + ' KB';
      })
      .catch(() => { imageMetaEl.textContent = '图片加载失败'; });
  }

  // ---- 剪贴板同步 ----
  async function init() {
    try {
      const data = await api('/api/clipboard');
      applyClipboard(data);
      setStatus('ok', '已同步 · ' + fmtTime(data.updated_at));
      refreshHistory();
      startPolling();
    } catch (_) { /* 401 已由 api() 处理 */ }
  }

  function scheduleSave() {
    dirty = true;
    setStatus('busy', '输入中…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, SAVE_DEBOUNCE);
  }

  async function doSave(force = false) {
    const content = clip.value;
    if (!force && !dirty && content === lastSavedText) return;
    dirty = true;
    setStatus('busy', '保存中…');
    try {
      const data = await api('/api/clipboard', { method: 'PUT', body: { content } });
      applyClipboard(data);
      dirty = false;
      setStatus('ok', '已保存 · ' + fmtTime(data.updated_at));
      refreshHistory();
    } catch (_) {
      setStatus('err', '保存失败，稍后重试');
    }
  }

  // ---- 自适应轮询 ----
  function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => setPollRate(POLL_SLOW), IDLE_MS);
    if (pollMs !== POLL_FAST) setPollRate(POLL_FAST);
  }

  function setPollRate(ms) {
    if (pollMs === ms) return;
    pollMs = ms;
    clearInterval(pollTimer);
    pollTimer = setInterval(poll, pollMs);
  }

  function startPolling() {
    pollTimer = setInterval(poll, pollMs);
    historyTimer = setInterval(() => { if (!document.hidden) refreshHistory(); }, HISTORY_POLL_MS);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) flushSave();
      else { resetIdle(); poll(); refreshHistory(); }
    });
    window.addEventListener('focus', () => { resetIdle(); poll(); refreshHistory(); });
    window.addEventListener('pagehide', flushSave);
    window.addEventListener('beforeunload', flushSave);
    ['input', 'click', 'touchstart', 'keydown'].forEach((ev) =>
      document.addEventListener(ev, resetIdle, { passive: true })
    );
  }

  // 离开/切换页面前，把防抖等待中的内容强制发出去（keepalive 允许请求在页面关闭后完成）
  function flushSave() {
    if (!dirty) return;
    const content = clip.value;
    clearTimeout(saveTimer);
    dirty = false;
    lastSavedText = content;
    try {
      fetch('/api/clipboard', {
        method: 'PUT',
        keepalive: true,
        headers: Object.assign(
          { 'Content-Type': 'application/json' },
          token ? { 'X-Clipboard-Token': token } : {}
        ),
        body: JSON.stringify({ content }),
      }).catch(() => {});
    } catch (_) { /* 忽略 */ }
  }

  async function poll() {
    if (document.hidden) return;
    try {
      const data = await api('/api/clipboard', {
        headers: lastVersion >= 0 ? { 'If-None-Match': '"v' + lastVersion + '"' } : {},
      });
      if (!data || data.__notModified) return; // 304 无变化
      if (data.version === lastVersion) return;
      if (!dirty) {
        applyClipboard(data);
        setStatus('ok', '已同步 · ' + fmtTime(data.updated_at));
        refreshHistory(); // 其他设备写入新内容时，同步刷新历史列表
      } else {
        pendingRemote = data;
        $('banner').classList.add('show');
      }
    } catch (_) { /* 网络抖动忽略 */ }
  }

  $('bannerLoad').onclick = () => {
    if (!pendingRemote) return;
    pendingRemote = null;
    $('banner').classList.remove('show');
    dirty = false;
    poll(); // 直接以最新服务器状态应用
  };

  // ---- 图片上传（含压缩）与设置 ----
  async function compressImage(file) {
    if (!file || !file.type || file.type.indexOf('image/') !== 0) return file;
    if (file.type === 'image/gif') return file; // 动画 GIF 不压缩
    try {
      const bmp = await createImageBitmap(file);
      const maxSide = 2048;
      const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
      if (scale === 1 && file.size <= 800 * 1024) { bmp.close(); return file; } // 小图直接用
      const w = Math.max(1, Math.round(bmp.width * scale));
      const h = Math.max(1, Math.round(bmp.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bmp, 0, 0, w, h);
      bmp.close();
      const hasAlpha = /png|webp/i.test(file.type);
      const mime = hasAlpha ? 'image/webp' : 'image/jpeg';
      let blob = await new Promise((res) => canvas.toBlob(res, mime, 0.85));
      if (!blob && hasAlpha) blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
      if (!blob) return file;
      if (blob.size >= file.size) return file; // 压缩没变小就用原图
      const base = file.name.replace(/\.[^.]+$/, '');
      return new File([blob], base + '.' + (mime.split('/')[1]), { type: mime });
    } catch (_) {
      return file; // 不支持解码时原图上传
    }
  }

  async function uploadImage(file) {
    const res = await fetch('/api/images', {
      method: 'POST',
      headers: { 'X-Clipboard-Token': token, 'Content-Type': file.type || 'application/octet-stream' },
      body: file,
    });
    if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
    if (!res.ok) throw new Error('upload failed');
    return res.json();
  }

  async function setClipboardImage(meta) {
    const data = await api('/api/clipboard', { method: 'PUT', body: { type: 'image', image_id: meta.id } });
    applyClipboard(data);
    dirty = false;
    setStatus('ok', '已保存图片 · ' + fmtTime(data.updated_at));
    toast('图片已保存');
    refreshHistory();
  }

  function getImageFromPaste(e) {
    const items = e.clipboardData && e.clipboardData.items;
    if (items) {
      for (const it of items) {
        if (it.type && it.type.indexOf('image/') === 0) {
          const f = it.getAsFile && it.getAsFile();
          if (f) return f;
        }
      }
    }
    const files = e.clipboardData && e.clipboardData.files;
    if (files) {
      for (const f of files) {
        if (f.type && f.type.indexOf('image/') === 0) return f;
      }
    }
    return null;
  }

  async function handlePastedImage(file) {
    setStatus('busy', '处理图片中…');
    try {
      const optimized = await compressImage(file);
      setStatus('busy', '上传图片中…');
      const meta = await uploadImage(optimized);
      await setClipboardImage(meta);
    } catch (_) {
      setStatus('err', '图片上传失败');
      toast('图片上传失败');
    }
  }

  // ---- 图片复制 / 下载 ----
  async function copyImageBlob(blob) {
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ [blob.type || 'image/png']: blob })]);
      return true;
    }
    return false;
  }

  function downloadBlob(blob, url) {
    const ext = (blob && blob.type && blob.type.split('/')[1]) || 'png';
    const a = document.createElement('a');
    a.href = url;
    a.download = '剪贴板图片 ' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.' + ext;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  $('copyImageBtn').onclick = async () => {
    const btn = $('copyImageBtn');
    if (!currentImageBlob) { toast('图片尚未加载完成'); return; }
    try {
      if (await copyImageBlob(currentImageBlob)) {
        flash(btn, '已复制图片 ✓');
        return;
      }
      throw new Error('unsupported');
    } catch (_) {
      downloadBlob(currentImageBlob, currentImageUrl);
      flash(btn, '已下载');
      toast('当前浏览器不支持复制图片，已改为下载');
    }
  };

  $('downloadBtn').onclick = () => {
    if (!currentImageBlob || !currentImageUrl) { toast('图片尚未加载完成'); return; }
    downloadBlob(currentImageBlob, currentImageUrl);
  };

  clipImg.addEventListener('click', () => {
    if (currentImageUrl) openLightbox(currentImageUrl);
  });

  // ---- 灯箱 ----
  function openLightbox(url) {
    if (!url) return;
    $('lightboxImg').src = url;
    $('lightbox').hidden = false;
  }
  function closeLightbox() {
    $('lightbox').hidden = true;
    $('lightboxImg').removeAttribute('src');
  }
  $('lightbox').addEventListener('click', (e) => {
    if (e.target === $('lightbox') || e.target.id === 'lightboxClose') closeLightbox();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

  // ---- 操作 ----
  clip.addEventListener('input', () => { updateChars(); autoResize(); scheduleSave(); });

  function updateChars() {
    $('chars').textContent = clip.value.length + ' 字符';
  }

  // 输入框高度随内容自适应（移动端更好用）
  function autoResize() {
    clip.style.height = 'auto';
    const max = Math.max(160, Math.round(window.innerHeight * 0.5));
    const h = Math.min(clip.scrollHeight, max);
    clip.style.height = h + 'px';
    clip.style.overflowY = clip.scrollHeight > max ? 'auto' : 'hidden';
  }

  // 底部轻提示
  let toastTimer = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        return true;
      } catch (_) { return false; }
    }
  }

  function flash(btn, msg) {
    const old = btn.innerHTML;
    btn.innerHTML = msg;
    btn.disabled = true;
    setTimeout(() => { btn.innerHTML = old; btn.disabled = false; }, 1200);
  }

  $('copyBtn').onclick = async () => {
    if (await copyText(clip.value)) flash($('copyBtn'), '已复制 ✓');
  };
  $('clearBtn').onclick = async () => {
    if (!confirm('清空主剪贴板？（历史记录里仍保留之前的条目）')) return;
    clip.value = '';
    updateChars();
    autoResize();
    doSave(true); // 强制保存，确保图片模式下的清空也能生效
  };
  $('pasteBtn').onclick = async () => {
    const btn = $('pasteBtn');
    try {
      if (!navigator.clipboard) throw new Error('unsupported');

      // 优先尝试读取图片（读取后压缩上传）
      if (navigator.clipboard.read) {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          const types = item.types || [];
          const imgType = types.find((x) => x.indexOf('image/') === 0);
          if (imgType) {
            const blob = await item.getType(imgType);
            const file = new File([blob], 'clipboard-image.' + (imgType.split('/')[1] || 'png'), { type: imgType });
            setStatus('busy', '处理图片中…');
            const optimized = await compressImage(file);
            setStatus('busy', '上传图片中…');
            const meta = await uploadImage(optimized);
            await setClipboardImage(meta);
            return;
          }
        }
      }

      // 没有图片则读取文本
      if (navigator.clipboard.readText) {
        const text = await navigator.clipboard.readText();
        if (text) {
          clip.value = text;
          setView('text');
          updateChars();
          autoResize();
          clearTimeout(saveTimer);
          await doSave(true);
          setStatus('ok', '已读取系统剪贴板并保存');
          toast('已读取系统剪贴板');
          return;
        }
      }
      throw new Error('empty');
    } catch (_) {
      flash(btn, '读取失败');
      setStatus('err', '无法读取系统剪贴板（权限或浏览器限制），请直接 Ctrl+V 粘贴');
    }
  };

  // 在页面任意位置粘贴：图片或文字直接作为剪贴板内容保存
  document.addEventListener('paste', (e) => {
    const t = e.target;
    if (t && t.id === 'tokenInput') return; // 密钥输入框保留默认行为

    const imgFile = getImageFromPaste(e);
    if (imgFile) {
      e.preventDefault();
      handlePastedImage(imgFile);
      return;
    }

    if (t === clip) return; // 文字粘贴进输入框用默认插入行为

    const text = e.clipboardData && e.clipboardData.getData('text/plain');
    if (text) {
      e.preventDefault();
      clip.value = text;
      updateChars();
      autoResize();
      clearTimeout(saveTimer);
      doSave(true);
      setStatus('ok', '已直接粘贴并保存');
      toast('已粘贴并保存');
    }
  });

  $('clearHistBtn').onclick = async () => {
    if (!confirm('确定清空全部历史记录？此操作不可恢复。')) return;
    await api('/api/history', { method: 'DELETE' });
    refreshHistory();
    toast('历史已清空');
  };

  // ---- 历史记录（增量渲染 + 图片缓存） ----

  // 历史图片加载：按 image_id 缓存 objectURL，未变化不重复请求
  function getCachedImage(imageId, imgEl, cb) {
    const hit = imageCache.get(imageId);
    if (hit) {
      imgEl.src = hit.url;
      if (cb) cb(hit.blob);
      return;
    }
    fetch('/api/images/' + imageId, { headers: { 'X-Clipboard-Token': token } })
      .then((r) => (r.ok ? r.blob() : Promise.reject(new Error('http'))))
      .then((blob) => {
        const url = URL.createObjectURL(blob);
        imageCache.set(imageId, { url, blob });
        imgEl.src = url;
        if (cb) cb(blob);
      })
      .catch(() => { imgEl.alt = '加载失败'; });
  }

  function buildHistoryItem(it) {
    const div = document.createElement('div');
    div.className = 'item';
    const entry = { el: div, it, url: null, blob: null };

    if (it.type === 'image') {
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';
      wrap.title = '点击查看大图';
      const img = document.createElement('img');
      img.className = 'thumb';
      img.alt = '历史图片';
      img.loading = 'lazy';
      wrap.appendChild(img);
      wrap.onclick = () => openLightbox(img.src);
      div.appendChild(wrap);
      getCachedImage(it.image_id, img, (blob) => { entry.blob = blob; entry.url = img.src; });
    } else {
      const content = it.content || '';
      if (isSingleUrl(content)) {
        // 整条是网址 → 链接卡片，点击直接打开
        const raw = content.trim();
        const url = cleanUrl(/^www\./i.test(raw) ? 'https://' + raw : raw);
        const a = document.createElement('a');
        a.className = 'url-card';
        a.href = url.replace(/["']/g, '');
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.title = url;
        a.innerHTML = ICON_LINK + '<span>' + escapeHtml(url) + '</span>';
        div.appendChild(a);
      } else {
        const pre = document.createElement('pre');
        pre.innerHTML = linkify(escapeHtml(content || '（空）'));
        div.appendChild(pre);
        if (content.length > 300) {
          pre.classList.add('clamped');
          const toggle = document.createElement('button');
          toggle.className = 'expand-btn';
          toggle.textContent = '展开全文';
          toggle.onclick = () => {
            const open = pre.classList.toggle('clamped');
            toggle.textContent = open ? '展开全文' : '收起';
          };
          div.appendChild(toggle);
        }
      }
    }

    const meta = document.createElement('div');
    meta.className = 'item-meta';
    const info = document.createElement('span');
    info.className = 'time';
    info.textContent = fmtTime(it.created_at) + (it.type === 'image' ? ' · 图片' : ' · ' + it.char_count + ' 字符');

    const btns = document.createElement('div');
    btns.className = 'btnrow';

    const copyBtn = document.createElement('button');
    copyBtn.innerHTML = it.type === 'image' ? ICON_IMG + '<span>复制图片</span>' : ICON_COPY + '<span>复制</span>';
    copyBtn.onclick = async () => {
      if (it.type === 'image') {
        if (!entry.blob) { toast('图片尚未加载完成'); return; }
        try {
          if (await copyImageBlob(entry.blob)) { flash(copyBtn, '已复制 ✓'); return; }
          throw new Error('unsupported');
        } catch (_) {
          const tmpUrl = entry.url || URL.createObjectURL(entry.blob);
          downloadBlob(entry.blob, tmpUrl);
          flash(copyBtn, '已下载');
          toast('当前浏览器不支持复制图片，已改为下载');
        }
      } else if (await copyText(it.content)) {
        flash(copyBtn, '已复制 ✓');
      }
    };

    // 历史图片条目提供独立下载按钮
    const dlBtn = it.type === 'image' ? document.createElement('button') : null;
    if (dlBtn) {
      dlBtn.innerHTML = ICON_DL + '<span>下载</span>';
      dlBtn.onclick = () => {
        if (!entry.blob) { toast('图片尚未加载完成'); return; }
        downloadBlob(entry.blob, entry.url || URL.createObjectURL(entry.blob));
        toast('已开始下载');
      };
    }

    const delBtn = document.createElement('button');
    delBtn.className = 'danger';
    delBtn.innerHTML = ICON_TRASH + '<span>删除</span>';
    let delTimer = null;
    delBtn.onclick = async () => {
      // 二次确认：第一次点击进入"待确认"状态，3 秒内再点一次才真正删除
      if (delBtn.dataset.armed !== '1') {
        delBtn.dataset.armed = '1';
        delBtn.innerHTML = '确认删除？';
        delBtn.classList.add('armed');
        clearTimeout(delTimer);
        delTimer = setTimeout(() => {
          delete delBtn.dataset.armed;
          delBtn.innerHTML = ICON_TRASH + '<span>删除</span>';
          delBtn.classList.remove('armed');
        }, 3000);
        return;
      }
      clearTimeout(delTimer);
      await api('/api/history/' + it.id, { method: 'DELETE' });
      refreshHistory();
      toast('已删除');
    };
    btns.appendChild(copyBtn);
    if (dlBtn) btns.appendChild(dlBtn);
    btns.appendChild(delBtn);

    meta.appendChild(info);
    meta.appendChild(btns);
    div.appendChild(meta);
    return entry;
  }

  // 增量渲染：复用未变化的元素，只增/删/改差异项，保留滚动位置与图片缓存
  function renderHistory(items) {
    const box = $('history');
    const ids = new Set(items.map((it) => it.id));

    // 移除已不存在的条目
    for (const [id, entry] of historyElMap) {
      if (!ids.has(id)) entry.el.remove();
    }

    if (!items.length) {
      box.innerHTML = searchQuery
        ? '<div class="empty">🔍 无匹配结果</div>'
        : '<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">暂无历史记录</div><div class="empty-sub">粘贴或输入内容后自动留档</div></div>';
      historyElMap = new Map();
      $('histCount').textContent = '';
      return;
    }

    const newMap = new Map();
    for (const it of items) {
      const old = historyElMap.get(it.id);
      const same = old && old.it.type === it.type && old.it.content === it.content &&
        old.it.image_id === it.image_id && old.it.created_at === it.created_at;
      if (old && same) {
        newMap.set(it.id, old);
        box.appendChild(old.el); // appendChild 移动已存在的节点，保证顺序
      } else {
        const entry = buildHistoryItem(it);
        newMap.set(it.id, entry);
        box.appendChild(entry.el);
      }
    }
    historyElMap = newMap;
    $('histCount').textContent = items.length ? '(' + items.length + ')' : '';
  }

  function applyFilter(items) {
    const q = searchQuery.trim().toLowerCase();
    if (!q) return items;
    return items.filter((it) => it.type === 'text' && it.content && it.content.toLowerCase().indexOf(q) !== -1);
  }

  async function refreshHistory() {
    if (document.hidden) return; // 后台标签页不重复请求
    try {
      const data = await api('/api/history');
      historyItems = data.items || [];
      renderHistory(applyFilter(historyItems));
    } catch (_) { /* 忽略 */ }
  }

  $('searchInput').addEventListener('input', () => {
    searchQuery = $('searchInput').value;
    renderHistory(applyFilter(historyItems));
  });

  // ---- PWA ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }

  // ---- 启动 ----
  if (token) init();
  else showLogin();
})();
</script>
</body>
</html>

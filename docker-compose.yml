services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - CLIPBOARD_TOKEN=${CLIPBOARD_TOKEN:?请在 .env 中设置 CLIPBOARD_TOKEN（随机长字符串）}
      - CLIPBOARD_DATA_DIR=/data
    volumes:
      - ./data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CLIPBOARD_DOMAIN=${CLIPBOARD_DOMAIN:?请在 .env 中设置 CLIPBOARD_DOMAIN（你的域名）}
      - CLIPBOARD_BASIC_AUTH_USER=${CLIPBOARD_BASIC_AUTH_USER:-admin}
      - CLIPBOARD_BASIC_AUTH_HASH=${CLIPBOARD_BASIC_AUTH_HASH:?请在 .env 中设置 CLIPBOARD_BASIC_AUTH_HASH（caddy hash-password 生成）}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
